
<style>
#erd-wrap svg { width: 100%; }
#erd-wrap svg .erDiagram .divider path { stroke-opacity: 0.5; }
#erd-wrap svg .erDiagram .row-rect-odd path,
#erd-wrap svg .erDiagram .row-rect-odd rect,
#erd-wrap svg .erDiagram .row-rect-even path,
#erd-wrap svg .erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd-wrap"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  BOOKS {
    int book_id PK
    string isbn
    string title
    string author
    string category
    int total_copies
    int available_copies
  }
  MEMBERS {
    int member_id PK
    string name
    string email
    date registered_at
  }
  LOANS {
    int loan_id PK
    int book_id FK
    int member_id FK
    date loaned_at
    date due_date
    date returned_at
  }
  RESERVATIONS {
    int reservation_id PK
    int book_id FK
    int member_id FK
    date reserved_at
  }
  BOOKS ||--o{ LOANS : "貸し出される"
  MEMBERS ||--o{ LOANS : "借りる"
  BOOKS ||--o{ RESERVATIONS : "予約される"
  MEMBERS ||--o{ RESERVATIONS : "予約する"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd-wrap').innerHTML = svg;
document.querySelectorAll('#erd-wrap svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd-wrap svg.erDiagram .row-rect-odd path, #erd-wrap svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
