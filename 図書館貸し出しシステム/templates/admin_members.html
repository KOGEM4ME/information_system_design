{% extends "base.html" %}
<!--
  admin_members.html  ―  利用者管理画面（管理者用）
  対応要求: FR-16（利用者の登録・編集・削除）
-->

{% block content %}
<h2>利用者管理（管理者）</h2>

<!-- 新規利用者登録フォーム -->
<div class="card mb-4">
  <div class="card-header bg-success text-white fw-bold">新規利用者登録（FR-16）</div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('admin_members') }}" class="row g-2">
      <div class="col-md-4">
        <input type="text" name="name" class="form-control" placeholder="氏名 *" required>
      </div>
      <div class="col-md-5">
        <input type="email" name="email" class="form-control"
               placeholder="メールアドレス *" required>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-success w-100">登録</button>
      </div>
    </form>
  </div>
</div>

<!-- 利用者一覧 -->
<h4>利用者一覧（{{ members | length }} 名）</h4>
<table class="table table-hover table-bordered">
  <thead class="table-dark">
    <tr>
      <th>ID</th><th>氏名</th><th>メールアドレス</th><th>登録日</th><th>操作</th>
    </tr>
  </thead>
  <tbody>
    {% for m in members %}
    <tr>
      <td>{{ m["member_id"] }}</td>
      <td>{{ m["name"] }}</td>
      <td>{{ m["email"] }}</td>
      <!-- 登録日時の先頭10文字だけ表示（"2026-06-29T..." → "2026-06-29"） -->
      <td>{{ m["registered_at"][:10] }}</td>
      <td>
        <form method="POST"
              action="{{ url_for('delete_member', member_id=m['member_id']) }}"
              onsubmit="return confirm('「{{ m['name'] }}」を削除しますか？')">
          <button type="submit" class="btn btn-danger btn-sm">削除</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
